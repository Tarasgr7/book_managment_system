version: '3.9'

services:
  postgres_db:
    image: postgres:13
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  test_db:
    image: postgres:13
    container_name: test_db
    environment:
      POSTGRES_USER: ${TEST_DB_USER}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD}
      POSTGRES_DB: ${TEST_DB_NAME}
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  fastapi:
    build: .
    container_name: fastapi_app
    depends_on:
      - postgres_db
      - test_db
    environment:
      DB_HOST: postgres_db
      DB_PORT: 5432
      TEST_DB_HOST: test_db
      TEST_DB_PORT: 5432
    ports:
      - "8000:8000"
    restart: always
    env_file:
      - ./.env

volumes:
  postgres_data:
  test_postgres_data:
